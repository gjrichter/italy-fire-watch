name: Update Italy fire hotspots

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch new hotspots
        run: python3 scripts/fetch_hotspots.py

      - name: Rebuild exclusion mask
        run: python3 scripts/build_mask.py

      - name: Rebuild filtered current-fires output
        run: python3 scripts/filter_fires.py

      - name: Commit and push if data changed
        run: |
          git config user.name "iXMapsBot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date --iso-8601=seconds)
          git commit -m "Update fire data: ${timestamp}" || exit 0
          git push
